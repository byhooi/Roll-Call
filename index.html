<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级点名系统</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Style -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="background-mesh">
        <div class="mesh-1"></div>
        <div class="mesh-2"></div>
        <div class="mesh-3"></div>
    </div>

    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">🎓</span>
                <h1>班级点名系统</h1>
            </div>
            <nav class="main-nav">
                <button class="nav-btn active" data-tab="roll-call">
                    <span class="icon">🎯</span>
                    <span>点名</span>
                </button>
                <button class="nav-btn" data-tab="students">
                    <span class="icon">👥</span>
                    <span>管理</span>
                </button>
                <button class="nav-btn" data-tab="statistics">
                    <span class="icon">📊</span>
                    <span>统计</span>
                </button>
            </nav>
        </header>

        <main class="content-area">
            <!-- 点名页面 -->
            <section id="roll-call" class="view-section active">
                <div class="glass-card main-card">
                    <div class="roll-display-area">
                        <div class="status-badge" id="roll-status">Ready to start</div>
                        <div id="selected-student" class="result-box">
                            <span class="placeholder-text">等待点名...</span>
                        </div>
                    </div>
                    <div class="control-area">
                        <button id="roll-btn" class="action-btn primary-btn pulse-glow">
                            <span class="btn-text">开始随机点名</span>
                            <div class="btn-bg"></div>
                        </button>
                    </div>
                    <div id="student-info" class="student-meta fade-in"></div>
                </div>
            </section>

            <!-- 学生管理页面 -->
            <section id="students" class="view-section">
                <div class="glass-card table-card">
                    <div class="card-header">
                        <h2>学生名册 <span class="badge" id="student-count">0</span></h2>
                        <div class="header-actions">
                            <button id="import-excel-btn" class="icon-btn" title="导入 Excel">
                                📤 导入
                            </button>
                            <button id="add-student-btn" class="icon-btn" title="手动添加">
                                ➕ 添加
                            </button>
                            <button id="clear-data-btn" class="icon-btn danger" title="清空数据">
                                🗑️ 清空
                            </button>
                            <input type="file" id="import-excel" accept=".xlsx,.xls" style="display:none;">
                        </div>
                    </div>

                    <div class="table-container">
                        <table id="students-table" class="modern-table">
                            <thead>
                                <tr>
                                    <th>座位号</th>
                                    <th>姓名</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="students-tbody">
                                <tr>
                                    <td colspan="3" class="empty-state">
                                        <div class="empty-content">
                                            <span class="empty-icon">📂</span>
                                            <p>暂无数据，请先导入</p>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- 统计分析页面 -->
            <section id="statistics" class="view-section">
                <div class="stats-overview">
                    <div class="glass-card stat-item">
                        <div class="stat-icon purple">🎲</div>
                        <div class="stat-info">
                            <h3>总点名次数</h3>
                            <p id="total-calls" class="stat-value">0</p>
                        </div>
                    </div>
                    <div class="glass-card stat-item">
                        <div class="stat-icon blue">👥</div>
                        <div class="stat-info">
                            <h3>学生总数</h3>
                            <p id="total-students" class="stat-value">0</p>
                        </div>
                    </div>
                    <div class="glass-card stat-item">
                        <div class="stat-icon pink">📈</div>
                        <div class="stat-info">
                            <h3>平均点名</h3>
                            <p id="avg-calls" class="stat-value">0</p>
                        </div>
                    </div>
                </div>

                <div class="glass-card chart-card">
                    <div class="card-header">
                        <h2>详细记录</h2>
                        <div class="header-actions">
                            <input type="text" id="stats-search" class="search-input" placeholder="🔍 搜索姓名或座位号...">
                            <button id="export-stats-btn" class="sm-btn">导出报表</button>
                            <button id="reset-stats-btn" class="sm-btn danger-text">重置周期</button>
                        </div>
                    </div>
                    <div id="stats-grid" class="stats-grid-container">
                        <div class="empty-state">暂无统计数据</div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Modal -->
        <div id="add-student-modal" class="modal-overlay">
            <div class="glass-modal">
                <div class="modal-header">
                    <h3>添加新学生</h3>
                    <button class="close-modal" id="cancel-add-btn">×</button>
                </div>
                <form id="add-student-form">
                    <div class="form-group">
                        <label>姓名</label>
                        <input type="text" id="student-name" required placeholder="请输入姓名">
                    </div>
                    <div class="form-group">
                        <label>座位号</label>
                        <input type="number" id="student-seat" required min="1" placeholder="例如: 101">
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="action-btn primary-btn full-width">确认添加</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/algorithm.js"></script>
    <script src="js/excel.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
